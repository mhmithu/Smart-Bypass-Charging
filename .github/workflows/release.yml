name: Build & Release Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Version from module.prop
        id: get_version
        run: |
          VERSION=$(grep "^version=" module.prop | cut -d'=' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Flashable ZIP
        run: |
          zip -r9 "Smart-Bypass-Charging-${{ env.VERSION }}.zip" \
            META-INF \
            webroot \
            module.prop \
            customize.sh \
            service.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Bypass-Charging-${{ env.VERSION }}
          path: Smart-Bypass-Charging-${{ env.VERSION }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Smart-Bypass-Charging-${{ env.VERSION }}.zip
          body_path: changelog.md